# Named config bundles ("recipes"), selected via `recipe=<name>` on the CLI
# (or `recipe: <name>` in default.yaml/default_eval.yaml) -- see config.py's
# load_config/load_eval_config for the merge order: schema <- default.yaml
# <- recipe <- explicit CLI overrides (so a CLI override always wins over
# whatever the recipe set, e.g. to tweak one field without forking a recipe).
#
# Why this file exists: the generator is fine-tuned against exactly ONE
# diffusion attack per run and evaluated for generalization against the
# OTHER, held-out one (see AttackWeights / EvalConfig comments in config.py
# for why holding one out matters). Which attack plays which role is a
# per-experiment choice, not something to hardcode into default.yaml /
# default_eval.yaml -- these recipes are that choice, named, so switching
# direction is `recipe=sgmse` vs. `recipe=audioldm` instead of re-typing
# every attack.weights.*/eval_attacks/held_out_attacks field by hand.
# Checkpoint/config *paths* stay out of here on purpose (machine-specific,
# multi-GB, never belong in git) -- pass those separately on the CLI, e.g.:
#   python -m audioseal_robust.train recipe=audioldm data.train_dir=... \
#       attack.audioldm.checkpoint=... attack.audioldm.config=...

train:
  # Train against AudioLDM (latent-diffusion resynthesis); SGMSE
  # stays at its config/default.yaml weight (0.0), so evaluate.py's
  # after_audioldm_training recipe below can hold it out as the probe.
  audioldm:
    attack:
      weights:
        identity: 0.0
        audioldm: 1.0
  # Train against SGMSE (OU-VE SDE speech enhancement) instead -- the
  # opposite direction, AudioLDM held out. This is the original design's
  # direction (see attacks.py's SGMSEAttack/AudioLDMAttack docstrings).
  sgmse:
    attack:
      weights:
        identity: 0.0
        sgmse: 1.0
  # Same direction as `sgmse` above, but half the steps are identity
  # (unattacked) instead of forcing the full SGMSE attack every single step.
  # Two motivations: (1) the generator gets some easy/unattacked steps to
  # anchor bit accuracy on, rather than only ever seeing the hardest case;
  # (2) SGMSEAttack's Langevin corrector has occasional gradient
  # instability (huge grad_norm_x_wm/x_att spikes, see its
  # AnnealedLangevinDynamics.update_fn), which this halves the exposure to.
  # A separate recipe rather than editing `sgmse` above -- same recipe name
  # silently changing what it trains against would be its own source of
  # confusion (old runs/notes referencing `recipe=sgmse` meant sgmse-only).
  sgmse_mixed:
    attack:
      weights:
        identity: 0.5
        sgmse: 0.5
  # The AudioLDM counterpart of `sgmse_mixed` above, and for a sharper reason
  # than that one: at `recipe=audioldm` (audioldm 1.0, identity 0.0) the
  # generator never sees an unattacked step, and AudioLDM destroys the
  # watermark outright rather than merely degrading it. Measured on the 4x
  # A100 manifold run <redacted-run>: bit_loss sat at
  # 0.698 against ln(2)=0.6931 -- chance, i.e. zero recoverable bits -- flat
  # across 530 steps, with presence_prob ~0.08 and no trend in the loss
  # (slope t=-0.04 against a per-step sd of 1.10). Evaluation on the smoke run
  # shows why: audioldm's attack_sisnr is -50 dB, so `x_att` is essentially
  # uncorrelated with `x_wm` at the sample level -- the HiFi-GAN vocoder
  # resynthesises phase from scratch. A loss pinned at chance carries no
  # gradient signal to learn from, so the identity half is what gives the
  # generator something to anchor bit accuracy on.
  #
  # Orthogonal knob, deliberately not baked in here: attack strength.
  # `attack.audioldm.strength_max` (default 0.08 ~ 80 diffusion steps) caps
  # the randomly sampled t*; lowering it to e.g. 0.02 both weakens the attack
  # and cuts step time, since that reverse loop dominates it. Pass it on the
  # CLI to combine the two axes, e.g.
  #   recipe=audioldm_mixed attack.audioldm.strength_max=0.02
  audioldm_mixed:
    attack:
      weights:
        identity: 0.5
        audioldm: 0.5

eval:
  # Pair with `recipe=audioldm` at train time: reports AudioLDM alongside
  # the always-available identity/bigvgan/dac attacks, holds SGMSE (and MBD)
  # out as the generalization probe.
  after_audioldm_training:
    eval_attacks: [identity, bigvgan, dac, audioldm]
    held_out_attacks: [sgmse, mbd]
  # Pair with `recipe=sgmse` at train time: the reverse -- SGMSE reported,
  # AudioLDM (and MBD) held out.
  after_sgmse_training:
    eval_attacks: [identity, bigvgan, dac, sgmse]
    held_out_attacks: [audioldm, mbd]
