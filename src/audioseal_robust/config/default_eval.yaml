# Default config for evaluate.py (baseline / post-fine-tuning evaluation).
# Override on the CLI, e.g.:
#   python -m audioseal_robust.evaluate eval_dir=/path/to/heldout/wavs label=baseline
#   python -m audioseal_robust.evaluate eval_dir=/path/to/heldout/wavs label=finetuned_epoch10 \
#       generator_checkpoint=./checkpoints/audioseal_robust/generator_epoch10.pth
#
# After fine-tuning with a train-time recipe (see config/recipes.yaml), pair
# it with the matching eval recipe so the report/held-out labeling matches
# which attack was actually trained against:
#   python -m audioseal_robust.evaluate recipe=after_audioldm_training eval_dir=... label=finetuned_audioldm \
#       generator_checkpoint=./checkpoints/audioseal_robust/generator_epochN.pth \
#       attack.audioldm.checkpoint=... attack.audioldm.config=... attack.sgmse.checkpoint=...
#   python -m audioseal_robust.evaluate recipe=after_sgmse_training eval_dir=... label=finetuned_sgmse \
#       generator_checkpoint=./checkpoints/audioseal_robust/generator_epochN.pth \
#       attack.sgmse.checkpoint=... attack.audioldm.checkpoint=... attack.audioldm.config=...

sample_rate: 16000
nbits: 16
device: auto
seed: 1234
recipe: null

generator_checkpoint: audioseal_wm_16bits
detector_checkpoint: audioseal_detector_16bits
label: baseline

eval_dir: ???
segment_duration: 3.0
batch_size: 8
n_eval_batches: 20
# Fixed watermark SNR (dB) the eval embedding is scaled to -- must match (or
# be comparable to) TrainConfig.watermark_snr_db_{min,max}'s range, or eval
# measures a different watermark strength than training optimized against.
# See EvalConfig.watermark_snr_db in config.py.
watermark_snr_db: 30.0
# Batches per robustness-curve point, cheaper than the headline number's
# n_eval_batches -- the curve is a shape read off a plot, the headline TPR@FPR
# is the number that gets quoted. See EvalConfig.n_curve_batches in config.py.
n_curve_batches: 6
# Eval-set dataloader workers. 0 serializes audio decode+resample with the
# forward passes on the main thread (a CPU stall between every batch).
num_workers: 4
output_dir: ./eval_outputs

# See EvalConfig.t_star_grid in config.py for how these were calibrated
# (mentor's curriculum table: t*=0.3..40 out of T=1000, NOT [0,1] fractions
# of full strength -- the old [0.0 .. 1.0] grid went ~25x past their "hard
# regime" and just destroys the audio).
fpr_target: 0.01
t_star_grid: [0.0, 0.0003, 0.002, 0.006, 0.015, 0.04, 0.08]
# The one t* the headline number is measured at for sgmse/audioldm (the
# other attacks ignore strength). 0.04 = t*=40 = the mentor table's "hard
# regime". NOT optional: leaving it unset makes each attack draw its own
# random t* per forward call, which is both ~12x slower on audioldm and
# gives positives/negatives different strengths. See
# EvalConfig.headline_strength in config.py.
headline_strength: 0.04

# Fallback used only when no `recipe=...` is given (see recipes.yaml's
# after_audioldm_training/after_sgmse_training, which override both of
# these together to match whichever attack was actually trained against).
eval_attacks: [identity, bigvgan, dac, audioldm]
held_out_attacks: [sgmse, mbd]

compute_pesq: true
compute_sisnr: true
compute_visqol: false

# Per-attack checkpoints -- None/null keeps that attack a stub (see
# attacks.py). Override on the CLI, e.g.:
#   attack.audioldm.checkpoint=/path/to/audioldm_root/data/checkpoints/audioldm-s-full \
#   attack.audioldm.config=src/audioldm_train/config/2023_08_23_reproduce_audioldm/audioldm_original.yaml
attack:
  bigvgan:
    checkpoint: null
  dac:
    checkpoint: null
  sgmse:
    # Eval-only step count (the TRAIN config keeps its own num_steps: 30) --
    # each step is corrector+predictor = 2 score-model calls, and eval never
    # backprops through them, so this is the single biggest sgmse lever. Note
    # the sampler's timesteps linspace always spans num_steps regardless of
    # t*, so low-t* curve points pay the same per-step cost as high ones.
    # TODO(sanity-check): confirm on a few batches that TPR@FPR at
    # num_steps=10 matches num_steps=30 within noise before trusting any
    # sgmse number quoted from this default; bump it back up if it doesn't.
    checkpoint: null
    num_steps: 10
  audioldm:
    checkpoint: null
    config: null
    strength_max: 0.08
  # MBD needs no local weights file (audiocraft downloads its own) -- set
  # checkpoint to any non-None value, e.g. attack.mbd.checkpoint=auto, to enable.
  mbd:
    checkpoint: null
    bandwidth: 3.0

tracking:
  backend: wandb
  project: audioseal-robust-eval
  run_name: null
  mlflow_tracking_uri: null
  wandb_mode: online
  log_audio_every: 0
