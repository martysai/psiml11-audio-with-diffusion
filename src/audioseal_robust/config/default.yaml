# Default config for generator-only robustness fine-tuning.
# Override any field on the CLI, e.g.:
#   python -m audioseal_robust.train data.train_dir=/path/to/wavs lambda_det=2.0
#
# To train against a specific diffusion attack, pick a named recipe (see
# config/recipes.yaml -- sets attack.weights.* for you) and supply that
# attack's checkpoint(s):
#   python -m audioseal_robust.train recipe=diff_erase data.train_dir=/path/to/wavs \
#       attack.diff_erase.checkpoint=/path/to/checkpoint.ckpt attack.diff_erase.config=/path/to/config.yaml
#   python -m audioseal_robust.train recipe=sgmse data.train_dir=/path/to/wavs \
#       attack.sgmse.checkpoint=/path/to/checkpoint.ckpt

sample_rate: 16000
nbits: 16
device: auto
epochs: 100
updates_per_epoch: 1000
log_every: 50
checkpoint_dir: ./checkpoints/audioseal_robust
seed: 1234
eval_every: 0
recipe: null

lambda_det: 1.0
lambda_perc: 1.0

# Per-example watermark SNR (dB), sampled uniformly per training step -- see
# TrainConfig.watermark_snr_db_{min,max} in config.py for how this range was
# picked (measured against stock AudioSeal on our own data, per mentor's plan).
watermark_snr_db_min: 24.0
watermark_snr_db_max: 36.0

generator:
  checkpoint: audioseal_wm_16bits

detector:
  checkpoint: audioseal_detector_16bits

attack:
  weights:
    identity: 1.0
    bigvgan: 0.0
    dac: 0.0
    sgmse: 0.0
    diff_erase: 0.0
  bigvgan:
    checkpoint: null
  dac:
    checkpoint: null
  sgmse:
    checkpoint: null
    num_steps: 30
  diff_erase:
    checkpoint: null
    config: null
    strength_max: 0.08

mel_loss:
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 20.0
  f_max: null

optim:
  lr: 5.0e-5
  betas: [0.5, 0.9]
  weight_decay: 0.0
  max_norm: 3.0

data:
  train_dir: ???
  valid_dir: null
  segment_duration: 1.0
  batch_size: 16
  num_workers: 4

tracking:
  backend: wandb
  project: audioseal-robust
  run_name: null
  mlflow_tracking_uri: null
  wandb_mode: online
  log_audio_every: 0
