$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json

# az ml environment create -f azureml/environment.yaml
#
# build.path is the repo root (this file lives one level down) because the
# Dockerfile COPYs the requirements-*.txt files, which live there. The repo
# snapshot is a few MB, so using it as the build context costs nothing.
name: audioseal-robust-diffusion
description: >-
  Training + eval environment for src/audioseal_robust: the base audioseal
  deps, the training/eval deps, and both held-out diffusion attack stacks
  (audioldm and mbd/MultiBand Diffusion). torch 2.4.1+cu121.

build:
  path: ..
  dockerfile_path: azureml/docker/Dockerfile
