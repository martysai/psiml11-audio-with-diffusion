$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# az ml job create -f azureml/jobs/train_diff_erase.yaml \
#     --set compute=azureml:<your-a100-cluster>
#
# The mirror image of train_sgmse.yaml: trains against DiffErase (AudioLDM
# latent-diffusion resynthesis) and holds SGMSE + MBD out. Run both; the
# comparison between the two directions is the experiment.
type: command

experiment_name: audioseal-robust-diffusion-swap
display_name: swap-diff-erase
description: >-
  Generator-only robustness fine-tuning against the DiffErase/AudioLDM attack,
  then eval with SGMSE and MBD held out.

code: ../..
environment: azureml:audioseal-robust-diffusion@latest
compute: azureml:gpu-cluster

inputs:
  librispeech:
    type: uri_folder
    path: azureml:librispeech-asr@1
    # download, not ro_mount -- see train_sgmse.yaml for the reasoning
    # (data.py:36 does a recursive walk per extension per split, and directory
    # listings over blobfuse are network round-trips).
    mode: download
  checkpoints:
    type: custom_model
    path: azureml:psiml-diffusion-checkpoints@1
    mode: ro_mount

outputs:
  artifacts:
    type: uri_folder
    mode: rw_mount

# Smaller batch than the sgmse direction on purpose: this one backprops
# through AudioLDM's VAE encoder + UNet reverse steps, which is the heavier
# of the two graphs. attack.diff_erase.strength_max stays at its default
# 0.08 -- config.py:91-100 explains why that ceiling exists (backprop through
# the full DDPM reverse loop is not memory-tractable), so raising it is how
# you OOM this job.
command: >-
  bash azureml/aml_run.sh diff_erase
  --librispeech ${{inputs.librispeech}}
  --checkpoints ${{inputs.checkpoints}}
  --artifacts ${{outputs.artifacts}}
  --
  epochs=3
  updates_per_epoch=200
  log_every=20
  eval_every=100
  data.batch_size=4
  data.num_workers=4
  data.segment_duration=2.0
  tracking.backend=none

environment_variables:
  PYTHONUNBUFFERED: "1"
  AZUREML_ARTIFACTS_DEFAULT_TIMEOUT: "1200"

resources:
  instance_count: 1

limits:
  timeout: 43200
