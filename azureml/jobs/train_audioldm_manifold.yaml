$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# az ml job create -f azureml/jobs/train_audioldm_manifold.yaml \
#   --name "train-audioldm-manifold-$(date +%m%d-%H%M%S)" \
#   --resource-group manifold3-rg --workspace-name as-manifold3-w3-ws
#
# Stage 2 of 2 on Singularity ("manifold"), 4x A100 via DDP. Do not submit this
# until smoke_audioldm_manifold.yaml has come back Completed -- it is the same
# code path, so a failure here costs 4 GPUs for however long it takes to notice
# rather than a few minutes on the smoke.
#
# Compliance: no WANDB_API_KEY, deliberately. See smoke_audioldm_manifold.yaml.
type: command

experiment_name: audioseal-robust-diffusion-swap
display_name: train-audioldm-manifold-4gpu
description: >-
  Full 100h AudioLDM-direction training run on 4x A100 under torchrun/DDP,
  with SGMSE held out as the unseen attack at evaluation.

code: ../..
environment: azureml:audioseal-robust-diffusion@latest

compute: /subscriptions/5c9e4789-4852-4ffe-8551-d682affcbd74/resourceGroups/manifold3-rg/providers/Microsoft.MachineLearningServices/virtualclusters/as-manifold3-w3-vc

resources:
  instance_type: Singularity.NC96ad_A100_v4
  instance_count: 1
  shm_size: 64g

queue_settings:
  # STANDARD ONLY. Never premium -- see smoke_audioldm_manifold.yaml. This is
  # the long-running job, so the temptation to buy a faster slot is highest
  # here; do not.
  job_tier: standard

inputs:
  librispeech:
    type: uri_folder
    path: azureml:librispeech-asr:1
    mode: download
  checkpoints:
    type: uri_folder
    path: azureml:psiml-diffusion-checkpoints:1
    mode: ro_mount

outputs:
  artifacts:
    type: uri_folder
    # rw_mount, not upload-on-finish: CHECKPOINT_DIR points straight in here
    # (azureml/aml_run.sh), so a completed epoch survives a later crash or a
    # timeout kill. On a run this long that is the difference between losing an
    # afternoon and losing everything.
    mode: rw_mount

# ---------------------------------------------------------------------------
# BUDGET -- PLACEHOLDER. Set epochs/updates_per_epoch and limits.timeout from
# the smoke run's measured seconds/step before submitting this.
#
# Why the config defaults are not usable: config.py ships epochs=100 x
# updates_per_epoch=1000, and updates_per_epoch is a per-epoch CAP rather than a
# target -- the inner loop also breaks when the dataloader is exhausted,
# whichever comes first. On the full 100h split that is 28,539 files; at
# batch_size=4 per GPU x 4 ranks = 16 per step with drop_last that is ~1,783
# steps/epoch, so the cap still binds and the run would be a genuine 100,000
# steps. Every step backprops through AudioLDM's VAE encoder plus its UNet
# reverse loop.
#
# DDP changes this arithmetic in one direction only: 4 ranks cut the number of
# steps needed to cover the corpus, they do not make an individual step 4x
# cheaper. Size from measured s/step on 4 GPUs, not from the 1-GPU figure.
#
# batch_size=4 PER GPU (16 effective), up from 8 on the single-GPU playground
# spec: this direction backprops through the heavier of the two attack graphs
# and 1x A100 was already OOMing. Raise this only after reading the smoke's
# reported peak_reserved_gb, which is now MAX-reduced across ranks.
#
# optim.lr is NOT rescaled for the larger effective batch -- see
# docs/MULTI_GPU.md. If you change the rank count, revisit it deliberately.
#
# attack.sgmse.num_steps only affects the held-out attack at eval time.
# attack.audioldm.strength_max stays at its default 0.08 -- config.py:91-100
# explains why that ceiling exists (backprop through the full DDPM reverse loop
# is not memory-tractable), so raising it is how you OOM this job.
# ---------------------------------------------------------------------------
command: >-
  bash azureml/aml_run.sh audioldm
  --librispeech ${{inputs.librispeech}}
  --checkpoints ${{inputs.checkpoints}}
  --artifacts ${{outputs.artifacts}}
  --
  epochs=20
  updates_per_epoch=1000
  log_every=50
  eval_every=250
  data.batch_size=4
  data.num_workers=8
  data.segment_duration=2.0
  attack.sgmse.num_steps=15

environment_variables:
  PYTHONUNBUFFERED: "1"
  AZUREML_ARTIFACTS_DEFAULT_TIMEOUT: "1200"
  # Full eval here, unlike the smoke. These are GLOBAL totals that evaluate.py
  # splits across ranks with shard_size(), so they must stay >= the GPU count.
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "86400"
  _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/5c9e4789-4852-4ffe-8551-d682affcbd74/resourceGroups/shared-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/as-shared-w3-id

limits:
  # PLACEHOLDER: 24h. Re-derive from the smoke's s/step. AML kills the job at
  # this limit, which is survivable only because artifacts is an rw_mount.
  timeout: 86400
