$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# az ml job create -f azureml/jobs/smoke_audioldm_4gpu.yaml \
#   --set compute=azureml:<multi-gpu-compute-name>
#
# Stage 1 of 2 on a 4-GPU node via DDP.
#
# This variant exists because the workload can exceed one GPU's memory. The
# compute target must provide four visible GPUs on one node; aml_run.sh detects
# them and launches torchrun automatically.
type: command

experiment_name: audioseal-robust-diffusion-swap
display_name: smoke-audioldm-4gpu
description: >-
  Cheap end-to-end validation of the AudioLDM-direction pipeline on 4x A100
  under torchrun/DDP: a handful of train steps and a reduced eval, purely to
  prove the distributed path works before committing to the full run.

code: ../..
environment: azureml:audioseal-robust-diffusion@latest

compute: azureml:multi-gpu-cluster

resources:
  # aml_run.sh reads the visible GPU count and launches one worker per GPU.
  instance_count: 1
  # NCCL's shared-memory transport lives in /dev/shm; the 64MB default makes
  # multi-GPU collectives fail or crawl. This belongs directly under
  # `resources`, not under `properties`.
  shm_size: 64g

inputs:
  librispeech:
    type: uri_folder
    path: azureml:librispeech-asr:1
    # download, not ro_mount -- data.py:WavDirDataset walks the tree once per
    # audio extension per split, and directory listings over blobfuse are
    # network round-trips.
    mode: download
  trainfixed:
    type: uri_folder
    path: azureml:librispeech-train-fixed-10s:1
    mode: download
  checkpoints:
    type: custom_model
    path: azureml:psiml-diffusion-checkpoints:1
    mode: ro_mount

outputs:
  artifacts:
    type: uri_folder
    mode: rw_mount

# data.batch_size is PER GPU under DDP, so batch_size=2 here means an effective
# batch of 8 across the four ranks.
#
# n_eval_batches=4 / n_curve_batches=4 are NOT arbitrary: both are GLOBAL
# totals that evaluate.py splits with shard_size(), so anything below
# world_size leaves the high ranks with an empty shard. n_eval_batches=2 on 4
# ranks would give ranks 2 and 3 zero batches and fail the run outright. 4 is
# the smallest value that keeps every rank fed.
command: >-
  bash azureml/aml_run.sh audioldm
  --librispeech ${{inputs.librispeech}}
  --train-dir ${{inputs.trainfixed}}
  --checkpoints ${{inputs.checkpoints}}
  --artifacts ${{outputs.artifacts}}
  --
  epochs=1
  updates_per_epoch=5
  log_every=1
  eval_every=2
  data.batch_size=2
  data.num_workers=2
  data.segment_duration=10.24
  attack.sgmse.num_steps=10

environment_variables:
  PYTHONUNBUFFERED: "1"
  AZUREML_ARTIFACTS_DEFAULT_TIMEOUT: "1200"
  EVAL_EXTRA_ARGS: "n_eval_batches=4 n_curve_batches=4"
  # Surface the real NCCL error instead of a generic hang, and do not let a
  # slow rank-0 checkpoint download trip the heartbeat watchdog.
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "86400"
limits:
  # 2h. Dominated by the image pull and the 6.8 GB download, not the 5 steps.
  timeout: 7200
