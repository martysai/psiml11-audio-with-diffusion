# python azureml/aml_submit.py --config azureml/configs/sgmse.yaml
#
# Trains against SGMSE, holds AudioLDM + MBD out (recipes.yaml's `sgmse` /
# `after_sgmse_training` pair). The static equivalent is
# azureml/jobs/train_sgmse.yaml -- keep the two in sync, or pick one.

# Workspace coordinates come from AZUREML_SUBSCRIPTION_ID,
# AZUREML_RESOURCE_GROUP and AZUREML_WORKSPACE_NAME, or from Azure CLI defaults.

direction: sgmse
# Override with --compute for your workspace.
compute: gpu-cluster
environment: azureml:audioseal-robust-diffusion@latest

experiment_name: audioseal-robust-diffusion-swap
display_name: swap-sgmse
description: >-
  Generator-only robustness fine-tuning against the SGMSE attack, then eval
  with AudioLDM and MBD held out.

inputs:
  librispeech: azureml:librispeech-asr:1
  checkpoints: azureml:psiml-diffusion-checkpoints:1

timeout_minutes: 720

# Forwarded verbatim to train.py as `key=value` argv. Anything settable on
# TrainConfig (src/audioseal_robust/config.py) works here; the merge order is
# schema <- default.yaml <- recipe <- these.
#
# ~600 steps, deliberately. config.py's defaults (epochs=100 x
# updates_per_epoch=1000) are 100k steps, and every step backprops through
# num_steps x (predictor + corrector) score-model calls -- far past a day of
# A100. Scale up after the first green run.
overrides:
  epochs: 3
  updates_per_epoch: 200
  log_every: 20
  # Needs data.valid_dir, which aml_run.sh/run_diffusion_swap.sh always set
  # (train.py:303-305 raises otherwise). Defaults to 0 = validation off.
  eval_every: 100
  data.batch_size: 8
  data.num_workers: 4
  data.segment_duration: 2.0
  attack.sgmse.num_steps: 15
  # Console only for the first run. tracking.py:84-85 does
  # set_experiment() + start_run(), and AML has already started a run for
  # this job -- flip to mlflow once you've confirmed those coexist.
  tracking.backend: none
