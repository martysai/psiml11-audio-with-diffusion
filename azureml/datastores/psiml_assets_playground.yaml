$schema: https://azuremlschemas.azureedge.net/latest/azureBlob.schema.json

# az ml datastore create -f azureml/datastores/psiml_assets_playground.yaml \
#   --resource-group manifold3-rg --workspace-name as-manifold3-w3-ws
#
# Read-only view of the psiml-assets/ prefix already staged in the playground
# workspace's blobstore, so the 18.8 GB of LibriSpeech + diffusion checkpoints
# does not have to be copied into manifold3's own storage.
#
# Identity-based (no `credentials:` block, matching the other cross-account
# datastores already registered in this workspace): the Singularity job
# identity as-shared-w3-id holds Storage Blob Data Contributor on
# asplaygroundw3data, so manifold jobs can read this container directly.
# Both accounts are in westus3, so this is not a cross-region read either.
name: psiml_assets_playground
type: azure_blob
description: >-
  Playground blobstore container holding the staged LibriSpeech corpus and the
  AudioLDM/SGMSE checkpoints under psiml-assets/. Read-only reference used by
  the manifold3 Singularity jobs.
account_name: asplaygroundw3data
container_name: azureml-blobstore-86098555-f08f-45ab-95b4-92ceded3d89d
protocol: https
