$schema: https://azuremlschemas.azureedge.net/latest/data.schema.json

# az ml data create -f azureml/assets/diffusion_checkpoints_manifold.yaml \
#   --resource-group manifold3-rg --workspace-name as-manifold3-w3-ws
#
# Same bytes as assets/diffusion_checkpoints.yaml, registered as a uri_folder
# DATA asset instead of a custom_model. That difference is forced, not stylistic:
#
# Registering a model asset makes the WORKSPACE MSI authenticate against the
# backing storage account to validate the path. psiml_assets_playground is a
# credential-less (identity-based) datastore pointing at the playground
# workspace's storage, and the manifold3 workspace MSI has no role there:
#
#   (UserError) Datastore has no credentials, and workspace msi failed to
#   authenticate storage account.
#
# Granting it would need Microsoft.Authorization/roleAssignments/write on
# playground-rg, which we do not hold. Data assets are registered purely by
# reference and skip that validation, so this path works today with no
# permission changes. The job identity (as-shared-w3-id) separately holds
# Storage Blob Data Contributor on the account, so the MOUNT at job time is
# unaffected either way -- only registration differed.
#
# Consumed as `type: uri_folder, mode: ro_mount`, which puts exactly the same
# read-only directory tree on the node as the custom_model input did.
#
# THE DIRECTORY LAYOUT IS LOAD-BEARING -- see assets/diffusion_checkpoints.yaml
# for the full explanation of why attacks.py requires
# audioldm/data/checkpoints/<file> specifically. Summary:
#
#   sgmse/train_vb_29nqe0uh_epoch=115.ckpt
#   audioldm/data/checkpoints/audioldm-s-full
#   audioldm/data/checkpoints/vae_mel_16k_64bins.ckpt
#   audioldm/data/checkpoints/clap_htsat_tiny.pt
#   audioldm/data/checkpoints/hifigan_16k_64bins.ckpt (+ .json)
type: uri_folder
name: psiml-diffusion-checkpoints
version: "1"
description: >-
  Frozen backbones for the two diffusion attacks: SGMSE (VoiceBank-DEMAND
  epoch 115) and AudioLDM-s-full plus its VAE/CLAP/HiFiGAN companions in the
  data/checkpoints/ layout attacks.py:AudioLDMAttack requires. Registered as a
  uri_folder (not custom_model) so it can reference the playground datastore
  without a workspace-MSI role assignment.
path: azureml://datastores/psiml_assets_playground/paths/psiml-assets/checkpoints
tags:
  sgmse: https://github.com/sp-uhh/sgmse
  audioldm: https://zenodo.org/records/7884686
  mounted: read-only
  registered_as: uri_folder-instead-of-custom_model
